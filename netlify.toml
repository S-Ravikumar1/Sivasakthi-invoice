[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["node_modules/@sparticuz/chromium/bin/**"]

[[redirects]]
  from = "/api/render-pdf"
  to = "/.netlify/functions/render-pdf"
  status = 200
  force = true
