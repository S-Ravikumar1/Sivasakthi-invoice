[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@sparticuz/chromium"]

[[redirects]]
  from = "/api/render-pdf"
  to = "/.netlify/functions/render-pdf"
  status = 200

[[redirects]]
  from = "/api/invoices"
  to = "/.netlify/functions/invoices"
  status = 200

[[redirects]]
  from = "/api/next-invoice-number"
  to = "/.netlify/functions/next-invoice-number"
  status = 200
